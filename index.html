<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MessHub - Quản lý đa tài khoản Zalo, Messenger, Fanpage, Telegram, WhatsApp trên Desktop.">
  <title>MessHub Control Center</title>
  <style>
    :root {
      --sidebar: 72px;
      --bg: #08111f;
      --panel: rgba(11, 18, 34, .78);
      --panel-soft: rgba(255, 255, 255, .06);
      --line: rgba(255, 255, 255, .1);
      --text: #eef4ff;
      --muted: #8ea2c8;
      --primary: #6ea8ff;
      --primary-2: #7c5cff;
      --success: #30d158;
      --danger: #ff5c7c;
      --warning: #ffb84d;
      --shadow: 0 24px 80px rgba(0, 0, 0, .45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(84, 123, 255, .22), transparent 30%),
        radial-gradient(circle at top right, rgba(124, 92, 255, .16), transparent 26%),
        linear-gradient(180deg, #0b1220, #060b14 68%);
      color: var(--text);
    }
    body.light-mode {
      --bg: #eef4ff;
      --panel: rgba(255, 255, 255, .84);
      --panel-soft: rgba(8, 22, 46, .05);
      --line: rgba(8, 22, 46, .08);
      --text: #17253d;
      --muted: #64748b;
      --shadow: 0 24px 60px rgba(66, 92, 140, .16);
      background:
        radial-gradient(circle at top left, rgba(110, 168, 255, .28), transparent 34%),
        radial-gradient(circle at top right, rgba(124, 92, 255, .18), transparent 28%),
        linear-gradient(180deg, #f8fbff, #edf3fb 68%);
    }

    #app-shell {
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      height: 100%;
      position: relative;
    }

    #sidebar {
      height: 100%;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      background: linear-gradient(180deg, rgba(9, 14, 26, .92), rgba(10, 18, 31, .72));
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0 10px;
      box-shadow: 8px 0 40px rgba(0, 0, 0, .25);
      z-index: 5;
    }
    body.light-mode #sidebar {
      background: linear-gradient(180deg, rgba(255, 255, 255, .86), rgba(244, 248, 255, .82));
    }

    #brand-badge {
      width: 48px;
      height: 48px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      letter-spacing: .6px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 16px 30px rgba(90, 117, 255, .35);
      margin-bottom: 14px;
    }

    #profiles-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 10px;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: 8px;
    }
    #profiles-list::-webkit-scrollbar { display: none; }

    .profile-btn {
      position: relative;
      border: 0;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .profile-btn {
      width: 46px;
      height: 46px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,.1), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.08);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .22);
    }
    body.light-mode .profile-btn {
      background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(241,245,255,.96));
      border-color: rgba(16, 30, 60, .08);
    }
    .profile-btn:hover { transform: translateY(-2px) scale(1.04); }
    .profile-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 14px 34px rgba(98, 112, 255, .4);
    }
    .badge {
      position: absolute;
      top: -4px;
      right: -5px;
      min-width: 17px;
      height: 17px;
      border-radius: 999px;
      padding: 0 4px;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff496d, #ff8744);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      border: 2px solid #0f1624;
    }
    .sidebar-spacer { flex: 1; }
    #btn-add-profile {
      margin-top: 10px;
      border: 1.5px dashed rgba(255,255,255,.2);
      background: rgba(255,255,255,.04);
    }

    @keyframes launcherPop { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99;
      background: rgba(3, 8, 17, .62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      align-items: center;
      justify-content: center;
      padding: 28px;
      animation: fadeIn .18s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-box, .panel-box {
      width: 520px;
      max-width: calc(100vw - 60px);
      max-height: 88vh;
      overflow: auto;
      border-radius: 28px;
      padding: 24px;
      background: linear-gradient(180deg, rgba(18, 27, 47, .94), rgba(10, 16, 29, .92));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .panel-box.wide { width: 940px; }
    .panel-box.mid { width: 700px; }
    body.light-mode .modal-box, body.light-mode .panel-box {
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(246,249,255,.94));
    }
    .panel-head, .section-head, .row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .panel-title, .section-title { margin: 0; }
    .panel-title { font-size: 22px; }
    .section-title { font-size: 15px; letter-spacing: .2px; }

    .modal-input, .modal-select, .modal-textarea {
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: inherit;
      padding: 13px 14px;
      font: inherit;
      outline: none;
      margin-top: 10px;
    }
    /* Sửa lỗi hiển thị danh sách dropdown */
    .modal-select option {
      background-color: #121b2f; /* Nền tối cho chế độ Dark Mode */
      color: #eef4ff;            /* Chữ màu trắng */
    }

    body.light-mode .modal-select option {
      background-color: #ffffff; /* Nền trắng cho chế độ Light Mode */
      color: #17253d;            /* Chữ màu đen */
    }
    body.light-mode .modal-input, body.light-mode .modal-select, body.light-mode .modal-textarea { background: rgba(10,20,40,.04); }
    .modal-input:focus, .modal-select:focus, .modal-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(110,168,255,.16); }
    .modal-textarea { min-height: 110px; resize: vertical; }
    .modal-btn {
      border: 0;
      border-radius: 14px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      color: inherit;
      transition: transform .18s ease, filter .18s ease;
      font-family: inherit;
    }
    .modal-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .modal-btn.cancel { background: rgba(255,255,255,.08); }
    body.light-mode .modal-btn.cancel { background: rgba(12,30,60,.08); }
    .modal-btn.save {
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 12px 24px rgba(91, 111, 255, .28);
    }
    .modal-btn.warn { background: rgba(255, 92, 124, .16); color: #ff7d97; }

    .grid-2, .grid-3, .stats-grid {
      display: grid;
      gap: 14px;
    }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3, .stats-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .card, .download-item, .workspace-item, .contact-item, .campaign-item, .ai-result, .activity-item {
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      padding: 14px;
    }
    body.light-mode .card,
    body.light-mode .download-item,
    body.light-mode .workspace-item,
    body.light-mode .contact-item,
    body.light-mode .campaign-item,
    body.light-mode .ai-result,
    body.light-mode .activity-item { background: rgba(10, 24, 46, .04); }

    .metric-card {
      padding: 16px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      min-height: 120px;
      position: relative;
      overflow: hidden;
    }
    .metric-card::after {
      content: '';
      position: absolute;
      inset: auto -10% -40% 40%;
      height: 100px;
      background: radial-gradient(circle, rgba(110,168,255,.22), transparent 60%);
    }
    .metric-label { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .metric-value { font-size: 34px; font-weight: 900; letter-spacing: -.8px; }
    .metric-foot { font-size: 12px; color: var(--muted); margin-top: 10px; }

    .chip-row, .tag-list, .status-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(110,168,255,.12);
      color: #8fc0ff;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(110,168,255,.16);
    }
    .chip.hot { background: rgba(255, 184, 77, .14); color: #ffc56d; }
    .chip.danger { background: rgba(255, 92, 124, .14); color: #ff8aa0; }
    .chip.success { background: rgba(48, 209, 88, .14); color: #68e58c; }

    .list-scroll { max-height: 380px; overflow: auto; padding-right: 4px; }
    .empty-state { text-align: center; color: var(--muted); padding: 24px 10px; }
    .download-meta, .muted, .subtle { color: var(--muted); font-size: 12px; }
    .title-lg { font-size: 18px; font-weight: 800; }
    .title-sm { font-size: 14px; font-weight: 700; }
    .progress { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
    .progress > span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--success)); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(255,255,255,.08);
    }
    .pill.running { color: #8fe8a8; }
    .pill.paused { color: #ffd47a; }
    .pill.stopped, .pill.failed { color: #ff95a8; }
    .pill.done { color: #7dc5ff; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .mb-12 { margin-bottom: 12px; }
    .mb-16 { margin-bottom: 16px; }
    .mb-20 { margin-bottom: 20px; }
    .mt-12 { margin-top: 12px; }
    .w-full { width: 100%; }

    #lock-overlay .modal-box { width: 420px; text-align: center; }
    code { background: rgba(110,168,255,.14); color: #8fc0ff; padding: 2px 6px; border-radius: 8px; }

    @media (max-width: 920px) {
      .grid-3, .stats-grid, .grid-2, .form-grid { grid-template-columns: 1fr; }
      .panel-box.wide, .panel-box.mid { width: 100%; }
    }
  </style>
</head>

<body class="dark-mode">
  <div id="app-shell">
    <div id="sidebar">
      <div id="profiles-list"></div>
      <button class="profile-btn" id="btn-add-profile" title="Thêm tài khoản">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <div class="sidebar-spacer"></div>
      <div id="btn-sidebar-back" title="Back" style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; cursor: pointer; margin-bottom: 12px; transition: all 0.3s ease;" onmouseover="this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </div>
      <div id="btn-sidebar-reload" title="Reload tab" style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; cursor: pointer; margin-bottom: 12px; transition: all 0.3s ease;" onmouseover="this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </div>
    </div>
  </div>

  

  

  <div id="workspace-overlay" class="overlay">
    <div class="panel-box mid">
      <div class="panel-head"><h3 class="panel-title">🗂️ Workspace</h3><button class="modal-btn cancel" data-close="workspace-overlay">Đóng</button></div>
      <p class="download-meta">Mỗi workspace có danh sách profile và quick replies riêng.</p>
      <div class="row mb-16">
        <input id="workspace-name-input" class="modal-input" placeholder="Tên workspace mới" style="margin:0;">
        <button id="workspace-create-btn" class="modal-btn save">Tạo mới</button>
      </div>
      <div id="workspace-list" class="list-scroll"></div>
    </div>
  </div>

  

  

  

  <div id="quick-replies-overlay" class="overlay">
    <div class="panel-box mid">
      <div class="panel-head"><h3 class="panel-title">💬 Tin nhắn mẫu</h3><button class="modal-btn cancel" data-close="quick-replies-overlay">Đóng</button></div>
      <p class="download-meta">Nhập <code>/1</code>, <code>/2</code> ... trong ô chat để chèn và gửi mẫu.</p>
      <div id="quick-replies-list" class="list-scroll mb-16"></div>
      <div class="row"><textarea id="quick-reply-input" class="modal-textarea" placeholder="Nhập nội dung quick reply mới" style="min-height:72px;margin:0;"></textarea><button class="modal-btn save" id="quick-reply-add">Thêm</button></div>
    </div>
  </div>

  <div id="modal-overlay" class="overlay">
    <div class="modal-box">
      <h3 id="modal-title" class="panel-title">Thêm tài khoản</h3>
      <div style="display:flex;align-items:center;gap:12px;margin-top:16px;">
        <div id="avatar-preview" style="width:56px;height:56px;border-radius:18px;background:#303544;cursor:pointer;display:flex;justify-content:center;align-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.1);">
          <span id="avatar-letter" style="font-size:24px;font-weight:bold;">+</span><img id="avatar-img" style="width:100%;height:100%;object-fit:cover;display:none;" />
        </div>
        <div class="muted" onclick="document.getElementById('avatar-input').click()" style="cursor:pointer;">Chọn ảnh đại diện<br>(Tùy chọn)</div>
        <input type="file" id="avatar-input" accept="image/*" style="display:none;">
      </div>
      <input type="text" id="profile-name-input" class="modal-input" placeholder="Tên hiển thị (để trống = tự lấy)">
      <input type="text" id="profile-proxy-input" class="modal-input" placeholder="Proxy: ip:port hoặc ip:port:user:pass">
      <select id="profile-platform-input" class="modal-select">
        <option value="zalo">💬 Zalo</option>
        <option value="telegram">✈️ Telegram</option>
        <option value="messenger">💙 Messenger</option>
        <option value="tiktok">📍 TikTok</option>
        <option value="fanpage">🚩 FB Fanpage</option>
        <option value="whatsapp">💚 WhatsApp</option>
        <option value="teams">🟣 Microsoft Teams</option>
        <option value="gmail">📧 Google / Gmail</option>
      </select>
      <div class="row"><button class="modal-btn warn" id="modal-delete" style="display:none;">Xóa</button><div><button class="modal-btn cancel" id="modal-cancel">Hủy</button><button class="modal-btn save" id="modal-save">Lưu</button></div></div>
    </div>
  </div>

  <div id="update-overlay" class="overlay">
    <div class="panel-box">
      <div class="panel-head"><h3 class="panel-title">Cập nhật ứng dụng</h3><button class="modal-btn cancel" data-close="update-overlay">Đóng</button></div>
      <p id="update-status" class="download-meta">Sẵn sàng kiểm tra cập nhật.</p>
      <div class="progress"><span id="update-progress"></span></div>
      <div style="margin-top:16px;text-align:right;"><button class="modal-btn cancel" id="update-check">Kiểm tra</button><button class="modal-btn save" id="update-download" style="display:none;">Tải xuống</button><button class="modal-btn save" id="update-install" style="display:none;">Cài đặt</button></div>
    </div>
  </div>

  <div id="lock-overlay" class="overlay">
    <div class="modal-box">
      <h2 style="margin-top:0;">🔒 Khóa ứng dụng</h2>
      <p id="lock-hint" class="download-meta">Nhập mật khẩu để mở khóa.</p>
      <input type="password" id="lock-password" class="modal-input" placeholder="Mật khẩu">
      <input type="password" id="lock-password-confirm" class="modal-input" placeholder="Nhập lại mật khẩu" style="display:none;">
      <button class="modal-btn save w-full" id="lock-submit">Mở khóa</button>
    </div>
  </div>

  

  

  <script src="renderer.js"></script>
</body>

</html>
